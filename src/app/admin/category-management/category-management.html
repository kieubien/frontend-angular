<main class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1">Quản lý Danh mục</h3>
        <p class="text-muted small mb-0">Tổ chức và phân loại sản phẩm của bạn.</p>
      </div>
      <button class="btn btn-pink rounded-pill px-4" (click)="openModal()">
        <i class="bi bi-plus-lg me-2"></i> Thêm danh mục
      </button>
    </div>

    <div class="admin-card overflow-hidden">
      <table class="table mb-0">
        <thead>
          <tr>
            <th>Tên danh mục</th>
            <th>Số SP</th>
            <th>Trạng thái</th>
            <th class="text-end">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cat of categories$ | async">
            <td><strong>{{ cat.name }}</strong></td>
            <td>{{ cat.product_count || 0 }}</td>
            <td>
              <span class="badge cursor" 
                    [ngClass]="cat.status === 'inactive' ? 'bg-secondary' : 'bg-success'"
                    (click)="toggleStatus(cat)">
                {{ cat.status === 'inactive' ? 'Ẩn' : 'Hiện' }}
              </span>
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-2" (click)="editCategory(cat)" title="Sửa">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteCategory(cat.id)" title="Xoá">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
</main>

<!-- Modal -->
<div class="admin-modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content-custom w-100" style="max-width: 600px;" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h5 class="modal-title">{{ editing ? 'Cập nhật' : 'Thêm mới' }} danh mục</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body p-4">
        <form #catForm="ngForm" (ngSubmit)="$event.preventDefault()">
          <div class="mb-3">
            <label class="form-label">Tên danh mục (*)</label>
            <input type="text" class="form-control" name="name" [(ngModel)]="form.name" required placeholder="Ví dụ: Son lì">
          </div>
          <div class="mb-3">
            <label class="form-label">Trạng thái (*)</label>
            <select class="form-select" name="status" [(ngModel)]="form.status" required>
              <option value="active">Hiển thị (Active)</option>
              <option value="inactive">Ẩn (Inactive)</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 p-4 pt-0">
        <button type="button" class="btn btn-light rounded-pill px-4" (click)="closeModal()">Hủy</button>
        <button type="button" class="btn btn-pink rounded-pill px-4" [disabled]="!catForm.valid" (click)="saveCategory()">
          {{ editing ? 'Lưu thay đổi' : 'Thêm danh mục' }}
        </button>
      </div>
  </div>
</div>
