<div class="product-card">
  <ng-container *ngIf="product">
    <div class="card-img-wrap" [routerLink]="['/products', product.id]" [class.is-unavailable]="product.status === 'inactive' || product.stock <= 0">
      <img *ngIf="product.image" [src]="product.image" [alt]="product.name" class="product-img">
      <div *ngIf="!product.image" class="no-img">
          <i class="bi bi-image"></i>
      </div>
      
      <div class="badges">
          <span class="badge inactive" *ngIf="product.status === 'inactive'">DỪNG BÁN</span>
          <span class="badge out-of-stock" *ngIf="product.status !== 'inactive' && product.stock <= 0">HẾT HÀNG</span>
          <span class="badge sale" *ngIf="product.badge === 'sale' && product.status !== 'inactive' && product.stock > 0">SALE</span>
          <span class="badge hot" *ngIf="product.badge === 'hot' && product.status !== 'inactive' && product.stock > 0">HOT</span>
      </div>
    </div>

    <div class="card-content">
      <div class="brand">{{ product.brand || 'BLUSH & BLOOM' }}</div>
      <h3 class="name" [routerLink]="['/products', product.id]">{{ product.name }}</h3>
      
      <div class="rating">
          <div class="stars">
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-fill"></i>
          </div>
          <span class="review-count">{{ product.review_count || 5 }}</span>
      </div>

      <div class="price-row">
        <span class="price">{{ product.price | number }}đ</span>
        <span class="original-price" *ngIf="product.original_price">{{ product.original_price | number }}đ</span>
        <span class="discount-badge" *ngIf="getDiscount() && product.status !== 'inactive' && product.stock > 0">-{{ getDiscount() }}%</span>
      </div>

      <div class="card-actions">
          <button class="btn-view" [routerLink]="['/products', product.id]">Xem chi tiết</button>
          <button class="btn-add-cart" [disabled]="product.status === 'inactive' || product.stock <= 0" (click)="addToCart()">
              <i class="bi bi-cart-plus" *ngIf="product.status !== 'inactive' && product.stock > 0"></i>
              {{ product.status === 'inactive' ? 'Dừng bán' : (product.stock <= 0 ? 'Tạm hết' : 'Thêm giỏ hàng') }}
          </button>
      </div>
    </div>
  </ng-container>
</div>
