<!-- BREADCRUMB -->
<div class="bc">
  <a routerLink="/">Trang chủ</a>
  <span>›</span>
  <span>{{ selectedCategory?.name || 'Sản phẩm' }}</span>
</div>

<!-- PAGE LAYOUT -->
<div class="page">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-section">
      <div class="sb-title">Danh mục</div>
      <div class="sb-list">
        <!-- Option Tất cả -->
        <div class="sb-item">
          <div class="sb-check">
            <input type="radio" name="cat" id="cat-all" [checked]="!selectedCategory" [routerLink]="['/products']">
            <label for="cat-all">Tất cả sản phẩm</label>
          </div>
        </div>
        <!-- Dynamic Categories -->
        <div class="sb-item" *ngFor="let cat of categories$ | async">
          <div class="sb-check">
            <input type="radio" name="cat" [id]="'cat-'+cat.id" [checked]="selectedCategory?.id === cat.id"
              [routerLink]="['/products']" [queryParams]="{category: cat.slug}">
            <label [for]="'cat-'+cat.id">{{ cat.name }}</label>
          </div>
          <span class="sb-count" *ngIf="cat.productCount">{{ cat.productCount }}</span>
        </div>
      </div>
    </div>

  </aside>

  <!-- MAIN CONTENT -->
  <div class="main">
    <div class="top-bar">
      <div class="result-txt" *ngIf="products$ | async as products">
        Hiển thị <strong>{{ products.length }}</strong> sản phẩm
      </div>
      <div class="search-wrap ms-md-auto">
        <div class="custom-search">
          <input type="text" placeholder="Tìm tên sản phẩm..." 
                 [(ngModel)]="searchTerm" (keyup.enter)="applyFilters()">
          <button (click)="applyFilters()">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="active-filters" *ngIf="searchTerm || selectedCategory">
      <span class="af-label">Lọc theo:</span>
      <div class="af-tag" *ngIf="searchTerm">{{ searchTerm }} <span class="af-x" (click)="searchTerm=''; applyFilters()">×</span></div>
      <div class="af-tag" *ngIf="selectedCategory">{{ selectedCategory.name }} <span class="af-x" [routerLink]="['/products']">×</span></div>
      <span class="af-clear" [routerLink]="['/products']" (click)="searchTerm=''">Xóa tất cả</span>
    </div>

    <div class="prod-grid" *ngIf="products$ | async as products">
      <div class="pc-col" *ngFor="let p of products; trackBy: trackByProductId">
        <app-product-card [product]="p"></app-product-card>
      </div>
      
      <!-- Thông báo nếu không có sản phẩm -->
      <div class="no-results py-5 text-center w-100" *ngIf="products.length === 0">
        <i class="bi bi-search display-1 text-muted"></i>
        <p class="mt-3 text-muted">Không tìm thấy sản phẩm nào khớp với tìm kiếm của bạn.</p>
        <button class="btn btn-outline-primary" [routerLink]="['/products']" (click)="searchTerm=''">Xem tất cả sản phẩm</button>
      </div>
    </div>

    <!-- PAGINATION -->
    <div class="pag">
      <div class="pag-btn">‹</div>
      <div class="pag-btn on">1</div>
      <div class="pag-btn">2</div>
      <div class="pag-btn">3</div>
      <div class="pag-btn">...</div>
      <div class="pag-btn">12</div>
      <div class="pag-btn">›</div>
    </div>
  </div>
</div>
